<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kas Kelas – Manajemen Kelas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app-layout">
  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <div class="brand-icon">🎓</div>
        <div>
          <div class="brand-name">ManajemenKelas</div>
          <div class="brand-sub">Sistem Informasi</div>
        </div>
      </div>
      <div class="sidebar-user">
        <div class="user-avatar" id="sidebar-avatar">A</div>
        <div class="user-info">
          <div id="sidebar-name">Loading…</div>
          <div id="sidebar-role"></div>
        </div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Menu Utama</div>
      <a class="nav-link" href="index.html" data-page="index.html"
         data-role-access="admin">
        <span class="nav-icon">📊</span> Dashboard
      </a>
      <a class="nav-link" href="kas.html" data-page="kas.html"
         data-role-access="admin,pengurus_kas">
        <span class="nav-icon">💰</span> Kas Kelas
      </a>
      <a class="nav-link" href="absensi.html" data-page="absensi.html"
         data-role-access="admin,pengurus_absensi">
        <span class="nav-icon">📋</span> Absensi
      </a>
      <a class="nav-link" href="laporan.html" data-page="laporan.html"
         data-role-access="admin,pengurus_kas,pengurus_absensi,pengunjung">
        <span class="nav-icon">📈</span> Laporan
      </a>
      <div class="nav-section-label">Admin</div>
      <a class="nav-link" href="index.html" data-role-access="admin">
        <span class="nav-icon">👥</span> Kelola Akun
      </a>
    </nav>
    <div class="sidebar-footer">
      <button id="logout-btn">🚪 Logout</button>
    </div>
  </aside>
  <div id="sidebar-overlay"></div>

  <div class="main-content">
    <header class="navbar">
      <button id="sidebar-toggle">☰</button>
      <h2 class="navbar-title">💰 Kas Kelas</h2>
    </header>

    <main class="page-content">
      <!-- STATS -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon orange">💰</div>
          <div>
            <div class="stat-value" id="stat-total">Rp 0</div>
            <div class="stat-label">Total Kas</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon blue">📄</div>
          <div>
            <div class="stat-value" id="stat-count">0</div>
            <div class="stat-label">Jumlah Pembayaran</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">👤</div>
          <div>
            <div class="stat-value" id="stat-siswa">0</div>
            <div class="stat-label">Siswa Bayar Bulan Ini</div>
          </div>
        </div>
      </div>

      <!-- TABEL PEMBAYARAN -->
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Daftar Pembayaran</h3>
          <button class="btn btn-primary btn-sm" id="btn-add-kas">+ Tambah Pembayaran</button>
        </div>

        <!-- FILTERS -->
        <div class="filters-bar">
          <div class="filter-group">
            <label class="filter-label">Bulan</label>
            <input type="month" class="filter-control" id="filter-bulan" />
          </div>
          <div class="filter-group">
            <label class="filter-label">Cari Siswa</label>
            <input type="text" class="filter-control" id="filter-siswa" placeholder="Nama siswa…" />
          </div>
          <div class="filter-group" style="justify-content:flex-end;margin-top:auto">
            <button class="btn btn-secondary btn-sm" id="btn-reset-filter">Reset</button>
          </div>
        </div>

        <div id="kas-table-wrap">
          <div class="loading-state"><div class="spinner"></div><p>Memuat data…</p></div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- MODAL KAS -->
<div class="modal-overlay" id="modal-kas">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-kas-title">Tambah Pembayaran</h3>
      <button class="modal-close" id="modal-kas-close">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="kas-id" />
      <div class="form-group">
        <label class="form-label">Siswa</label>
        <select class="form-control" id="kas-student">
          <option value="">-- Pilih Siswa --</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Tanggal Bayar</label>
          <input class="form-control" type="date" id="kas-tanggal" />
        </div>
        <div class="form-group">
          <label class="form-label">Nominal (Rp)</label>
          <input class="form-control" type="number" id="kas-nominal"
                 placeholder="50000" min="0" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Keterangan</label>
        <input class="form-control" type="text" id="kas-keterangan"
               placeholder="Kas bulan Januari, dll." />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modal-kas-cancel">Batal</button>
      <button class="btn btn-primary" id="modal-kas-save">Simpan</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script type="module">
import './app.js';
import { supabaseClient } from './supabase.js';

const user = await App.requireAuth(['admin', 'pengurus_kas']);
if (!user) throw new Error('No access');

// Default filter bulan
const today = new Date();
const bulanDefault = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
document.getElementById('filter-bulan').value = bulanDefault;

// ── LOAD STUDENTS ────────────────────────────────────────────
async function loadStudents() {
  const { data } = await supabaseClient.from('students').select('id,nama').order('nama');
  const sel = document.getElementById('kas-student');
  (data || []).forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id; opt.textContent = s.nama;
    sel.appendChild(opt);
  });
  return data || [];
}

const students = await loadStudents();
const studentMap = Object.fromEntries(students.map(s => [s.id, s.nama]));

// ── LOAD KAS ─────────────────────────────────────────────────
async function loadKas() {
  const bulan  = document.getElementById('filter-bulan').value;
  const search = document.getElementById('filter-siswa').value.trim().toLowerCase();

  let query = supabaseClient
    .from('cash_payments')
    .select('*, students(nama)')
    .order('tanggal_bayar', { ascending: false });

  if (bulan) {
    const [yr, mn] = bulan.split('-');
    query = query
      .gte('tanggal_bayar', `${yr}-${mn}-01`)
      .lte('tanggal_bayar', `${yr}-${mn}-31`);
  }

  const { data, error } = await query;
  const wrap = document.getElementById('kas-table-wrap');

  if (error) { App.showToast('Gagal memuat data kas.', 'error'); return; }

  let rows = data || [];
  if (search) rows = rows.filter(r => r.students?.nama?.toLowerCase().includes(search));

  // Update stats
  const total = rows.reduce((s, r) => s + Number(r.nominal), 0);
  document.getElementById('stat-total').textContent  = App.formatCurrency(total);
  document.getElementById('stat-count').textContent  = rows.length;
  const uniqueSiswa = new Set(rows.map(r => r.student_id)).size;
  document.getElementById('stat-siswa').textContent  = uniqueSiswa;

  if (!rows.length) { App.showEmpty('kas-table-wrap', 'Belum ada data pembayaran.'); return; }

  wrap.innerHTML = `
    <div class="table-wrapper">
      <table>
        <thead><tr>
          <th>#</th><th>Siswa</th><th>Tanggal Bayar</th>
          <th>Nominal</th><th>Keterangan</th><th style="text-align:right">Aksi</th>
        </tr></thead>
        <tbody>
          ${rows.map((r, i) => `
            <tr>
              <td>${i+1}</td>
              <td>${r.students?.nama || '–'}</td>
              <td>${App.formatDate(r.tanggal_bayar)}</td>
              <td>${App.formatCurrency(r.nominal)}</td>
              <td>${r.keterangan || '–'}</td>
              <td>
                <div class="td-actions">
                  <button class="btn btn-ghost btn-sm"
                    onclick='openEdit(${JSON.stringify(r)})'>✏️</button>
                  <button class="btn btn-ghost btn-sm" style="color:var(--danger)"
                    onclick="doDelete('${r.id}')">🗑️</button>
                </div>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

loadKas();

// ── FILTERS ──────────────────────────────────────────────────
document.getElementById('filter-bulan').onchange = loadKas;
document.getElementById('filter-siswa').oninput  = loadKas;
document.getElementById('btn-reset-filter').onclick = () => {
  document.getElementById('filter-bulan').value  = bulanDefault;
  document.getElementById('filter-siswa').value  = '';
  loadKas();
};

// ── MODAL ─────────────────────────────────────────────────────
const modalKas = document.getElementById('modal-kas');
const modalTitle = document.getElementById('modal-kas-title');

function openModal(title) {
  modalTitle.textContent = title;
  modalKas.classList.add('show');
}

function closeModal() {
  modalKas.classList.remove('show');
  document.getElementById('kas-id').value         = '';
  document.getElementById('kas-student').value    = '';
  document.getElementById('kas-tanggal').value    = '';
  document.getElementById('kas-nominal').value    = '';
  document.getElementById('kas-keterangan').value = '';
}

document.getElementById('btn-add-kas').onclick      = () => {
  document.getElementById('kas-tanggal').value = today.toISOString().split('T')[0];
  openModal('Tambah Pembayaran');
};
document.getElementById('modal-kas-close').onclick  = closeModal;
document.getElementById('modal-kas-cancel').onclick = closeModal;

window.openEdit = (r) => {
  document.getElementById('kas-id').value         = r.id;
  document.getElementById('kas-student').value    = r.student_id;
  document.getElementById('kas-tanggal').value    = App.formatDateInput(r.tanggal_bayar);
  document.getElementById('kas-nominal').value    = r.nominal;
  document.getElementById('kas-keterangan').value = r.keterangan || '';
  openModal('Edit Pembayaran');
};

document.getElementById('modal-kas-save').onclick = async () => {
  const id         = document.getElementById('kas-id').value;
  const student_id = document.getElementById('kas-student').value;
  const tanggal    = document.getElementById('kas-tanggal').value;
  const nominal    = Number(document.getElementById('kas-nominal').value);
  const keterangan = document.getElementById('kas-keterangan').value.trim();

  if (!student_id) { App.showToast('Pilih siswa terlebih dahulu.', 'error'); return; }
  if (!tanggal)    { App.showToast('Tanggal bayar wajib diisi.', 'error'); return; }
  if (!nominal || nominal <= 0) { App.showToast('Nominal harus lebih dari 0.', 'error'); return; }

  const payload = { student_id, tanggal_bayar: tanggal, nominal, keterangan };

  let error;
  if (id) {
    ({ error } = await supabaseClient.from('cash_payments').update(payload).eq('id', id));
  } else {
    ({ error } = await supabaseClient.from('cash_payments').insert(payload));
  }

  if (error) { App.showToast('Gagal menyimpan data: ' + error.message, 'error'); return; }
  App.showToast(id ? 'Pembayaran diperbarui.' : 'Pembayaran ditambahkan.', 'success');
  closeModal();
  loadKas();
};

window.doDelete = async (id) => {
  const ok = await App.confirmDelete('Hapus data pembayaran ini?');
  if (!ok) return;
  const { error } = await supabaseClient.from('cash_payments').delete().eq('id', id);
  if (error) { App.showToast('Gagal menghapus data.', 'error'); return; }
  App.showToast('Pembayaran dihapus.', 'success');
  loadKas();
};
</script>
</body>
</html>
